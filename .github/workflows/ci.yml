name: Backend Tests

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ejecutar pruebas del backend
        run: mvn test
        working-directory: backend